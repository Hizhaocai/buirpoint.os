# This file is copied beside Supabase's official docker-compose.yml on the
# server. It replaces published ports rather than adding another public port.
# Caddy is the sole public entry point; Studio and database pooler are not
# published outside Docker.
services:
  kong:
    ports: !override
      - "127.0.0.1:${KONG_HTTP_PORT}:8000/tcp"

  # Keep the global ceiling aligned with the largest Portfolio video.
  # Individual buckets and CMS validation retain their narrower limits.
  storage:
    environment:
      FILE_SIZE_LIMIT: 209715200

  supavisor:
    ports: !reset []
